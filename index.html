<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski Trick Visualizer</title>
<meta name="description" content="See where your body should be, moment by moment, through freestyle ski tricks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage" aria-label="3D view of the jump"></div>

<header class="title" aria-live="polite">
  <h1 id="trickName">Loading</h1>
  <p id="trickExplain">Getting the skier and the jump ready.</p>
</header>

<aside class="readout" aria-label="Live readout">
  <dl>
    <div><dt>Time</dt><dd><span id="rTime">0.00</span><small> s</small></dd></div>
    <div><dt>Hips above snow</dt><dd><span id="rHeight">0.0</span><small> m</small></dd></div>
    <div><dt>Speed</dt><dd><span id="rSpeed">0</span><small> km/h</small></dd></div>
    <div><dt>Spin</dt><dd><span id="rSpin">0</span><small>&deg;</small></dd></div>
    <div><dt>Flip</dt><dd><span id="rFlip">0</span><small>&deg;</small></dd></div>
  </dl>
  <p id="rInverted" class="inverted" hidden>Upside down</p>
</aside>

<nav class="panel" aria-label="Choose a trick">
  <div class="panel-scroll" id="trickList"></div>
  <div class="panel-foot">
    <fieldset class="seg" id="jumpSeg"><legend>Jump</legend></fieldset>
    <fieldset class="seg" id="camSeg"><legend>Camera</legend></fieldset>
    <label class="toggle"><input type="checkbox" id="seqToggle"> Show sequence <kbd>S</kbd></label>
    <div class="runstats" id="runStats"></div>
  </div>
</nav>

<footer class="timeline" aria-label="Timeline">
  <div class="tl-controls">
    <button id="playBtn" class="play" aria-label="Play">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="playIcon" d="M7 4l13 8-13 8z"/></svg>
    </button>
    <div class="speeds" id="speedSeg" role="group" aria-label="Playback speed"></div>
  </div>
  <div class="tl-track" id="track" role="slider" tabindex="0" aria-label="Scrub through the trick" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
    <div class="tl-air" id="airBand"></div>
    <div class="tl-marks" id="marks"></div>
    <div class="tl-head" id="head"><span id="headTime">0.00 s</span></div>
  </div>
  <p class="tl-hint">Drag to scrub. <kbd>Space</kbd> play, <kbd>&larr;</kbd><kbd>&rarr;</kbd> step a frame, <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> camera.</p>
</footer>

<div class="loader" id="loader" role="status">Loading the skier</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
